services:
  sgi-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgi-app:production
    container_name: sgi_production_app
    restart: always
    ports:
      - "${PROD_PORT:-80}:80"
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sgi_prod_storage:/var/www/html/storage/app/public
      - sgi_prod_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sgi_prod_storage:
    name: sgi_prod_storage
  sgi_prod_logs:
    name: sgi_prod_logs
