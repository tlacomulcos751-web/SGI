services:
  sgi-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgi-app:latest
    container_name: sgi_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-SGI}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:3f98R+3x5n7yqZ7A1W2e3R4t5Y6u7I8o9P0a1S2d3F4=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-naoproye_inventario}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-root}"
      RUN_MIGRATIONS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sgi_storage:/var/www/html/storage/app/public
      - sgi_logs:/var/www/html/storage/logs

volumes:
  sgi_storage:
  sgi_logs:
